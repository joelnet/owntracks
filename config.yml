max_accuracy_m: 30
distance_unit: miles

poi:
  default_radius_m: 100
  min_transition_points: 3
  exit_extra_m: 25
  min_transition_seconds: 300
  # Arriving at an already-known POI skips the transition debounce above once
  # this many consecutive stationary fixes land there. 1 = notify on the first
  # parked fix (fastest, but a red light inside a POI radius can fire a false
  # arrival). 0 disables the fast path.
  immediate_arrival_stationary_points: 2
  # A fix with no vel field counts as stationary when it moved at most this far
  # (meters) from the previous fix. OwnTracks Android >= 2.5.9 omits vel
  # entirely when parked instead of sending vel=0, so displacement is the only
  # parked signal. Replay of May 12 - Jul 19 data: 0 false arrivals at 10-30m;
  # 15m accelerated 40 arrivals (up to 15 min faster). 0 disables the fallback
  # (fast path then requires literal vel=0 fixes, which the phone no longer sends).
  stationary_displacement_m: 15
  locations:
    - name: Home
      points:
        - lat: 34.0170901
          lon: -117.9025897
          radius_m: 100
        # Secondary anchor for a recurring phone network-fallback coordinate
        # (~265m NE of the real home) that would otherwise misclassify as Roaming.
        - lat: 34.019098
          lon: -117.901050
          radius_m: 50
    - name: Target
      lat: 34.0297163
      lon: -117.9190439
    - name: Work
      lat: 33.6349701
      lon: -117.849966
      radius_m: 100
    - name: Mom's House
      lat: 33.7245
      lon: -117.9759
    - name: SF Supermarket
      lat: 34.0114724
      lon: -117.8854873
      radius_m: 50
    - name: CVS
      lat: 34.0105651
      lon: -117.8862608
      radius_m: 50

activity:
  enabled: true
  discord_notifications: true
  dwell_threshold_minutes: 5
  walking_max_kmh: 7
  driving_min_kmh: 25
  window_size: 5
  min_transition_seconds: 120
  min_point_interval_seconds: 5

discord:
  command_channel_id: "540397251466362920"

visit_detection:
  enabled: true
  containment_radius_m: 200
  min_dwell_minutes: 5
  exit_timeout_minutes: 3
  discord_notifications: true
  learn_pois: true
  learned_poi_radius_m: 100
  min_distance_from_known_poi_m: 200

geocode:
  cache_radius_m: 100
